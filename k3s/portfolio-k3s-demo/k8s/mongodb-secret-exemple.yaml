# QUOI    : Modèle de Secret — à copier en "mongodb-secret.yaml" et à éditer
#           AVANT de déployer. Ce fichier-exemple peut être versionné sans
#           risque car il ne contient pas de vrai mot de passe.
# POURQUOI: Un vrai Secret avec un mot de passe en clair ne doit jamais être
#           commité sur GitHub (même un repo "supprimé" garde son historique).
# COMMENT : cp mongodb-secret.example.yaml mongodb-secret.yaml
#           puis remplace CHANGE_ME par un vrai mot de passe.
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-secret
  namespace: portfolio
type: Opaque
stringData:
  password: Passer123
